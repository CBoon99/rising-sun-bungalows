<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking received | Rising Sun Bungalows</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Your Rising Sun Bungalows stay request was received. We normally reply within 12 hours.">
    <link rel="canonical" href="https://risingsunbungalows.com/thank-you.html">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0d9488">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500&family=Syne:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rsb-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      .thanks {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      .thanks h1 {
        font-size: clamp(2.5rem, 6vw, 3.5rem);
        margin: 0 0 1rem;
      }
      .thanks p {
        max-width: 28rem;
        color: var(--text-muted);
        line-height: 1.65;
        margin: 0 0 2rem;
      }
    </style>
</head>
<body>
    <div class="thanks">
        <div class="brand" style="margin-bottom:2rem;justify-content:center">
            <span class="brand-mark" aria-hidden="true">RS</span>
            <div class="brand-text">
                <small>Gili Meno</small>
                <strong>Rising Sun</strong> <span>Bungalows</span>
            </div>
        </div>
        <h1 class="display">Thank you</h1>
        <p>Your stay request was sent. We normally reply within 12 hours. For diving enquiries, visit <a class="link-accent" href="https://www.menodiveclub.com" target="_blank" rel="noopener noreferrer">Meno Dive Club</a>. Follow us on <a class="link-accent" href="https://www.instagram.com/risingsunbungalows/" target="_blank" rel="noopener noreferrer">Instagram</a>.</p>
        <div class="flex-wrap" style="justify-content:center">
            <a href="/" class="btn btn-primary">Back to site</a>
            <button type="button" class="btn btn-ghost" id="theme-toggle" aria-label="Toggle theme">Toggle theme</button>
        </div>
        <p class="faint" style="margin-top:3rem;font-size:0.75rem">Developed by <a class="link-accent" href="https://boonmind.io" target="_blank" rel="noopener noreferrer">boonmind.io</a></p>
    </div>
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        function apply(mode) {
          root.classList.toggle('dark', mode === 'dark');
          try { localStorage.setItem('rsb-theme', mode); } catch (e) {}
        }
        if (btn) {
          btn.addEventListener('click', function () {
            apply(root.classList.contains('dark') ? 'light' : 'dark');
          });
        }
      })();
    </script>
</body>
</html>
