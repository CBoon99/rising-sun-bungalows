get_there:
  eyebrow: Logistics
  heading: How to get to Gili Meno
  intro: Rising Sun Bungalows is less than 2 minutes on foot from Gili Meno harbour. No cars or scooters on the Gili Islands — walk, bike, or cidomo once you land.
  routes:
    - kicker: From Bali
      title: Fast boat to the Gilis
      body: How to get to Gili Meno from Bali — about 1.5–2 hours by fast boat from Sanur, Serangan, or Padang Bai. Some boats call at Gili Trawangan or Gili Air first; hop a short inter-island boat to Meno if needed.
    - kicker: From Lombok
      title: Bangsal harbour boat
      body: Public or private boat from Bangsal harbour (or nearby ports such as Teluk Nare) — typically 20–40 minutes to Gili Meno harbour.
    - kicker: Airport LOP
      title: Lombok Airport to Meno
      body: Fly into Lombok International Airport (LOP), road transfer to Bangsal (about 1–1.5 hrs), then boat to Gili Meno. Ask when booking for driver pointers.
    - kicker: Gili T or Air
      title: Island hop the Gilis
      body: Short public or private boat between Gili Trawangan, Gili Air, and Gili Meno — usually 5–20 minutes. Easy if you are already in the Gili Islands.
  landing_heading: Once you land at Gili Meno harbour
  steps:
    - Step off at **Gili Meno harbour**.
    - Less than a **2-minute walk** — message us your arrival boat and we'll meet you or send pin directions.
    - Luggage? A **cidomo** (horse cart) can drop you at the gate for a small fee if you prefer not to walk.
  tip: "Tip: morning boats are calmer. If seas look rough, ask your operator—schedules shift with weather."
  cta_label: Tell us your arrival plans
  map_caption: Approximate pin near Gili Meno harbour — we'll refine walking directions when you book.

