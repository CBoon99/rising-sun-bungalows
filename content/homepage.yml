get_there:
  eyebrow: Logistics
  heading: How to get there
  intro: We're less than 2 minutes on foot from Gili Meno harbour. No cars or scooters on the Gilis—walk, bike, or cidomo once you land.
  routes:
    - kicker: From Bali
      title: Fast boat
      body: About 1.5–2 hours from Sanur, Serangan, or Padang Bai. Some boats call at Trawangan or Air first—hop a short inter-island boat to Meno if needed.
    - kicker: From Lombok
      title: Bangsal boat
      body: Public or private boat from Bangsal harbour (or nearby ports) — typically 20–40 minutes to Gili Meno harbour.
    - kicker: Airport LOP
      title: Fly, road, boat
      body: Lombok International Airport to Bangsal by road (about 1–1.5 hrs depending on traffic), then boat to Meno. Ask when booking for driver pointers.
    - kicker: Gili T or Air
      title: Island hop
      body: Short public or private boat between the three Gilis — usually 5–20 minutes. Easy if you're already in the archipelago.
  landing_heading: Once you land on Meno
  steps:
    - Step off at **Gili Meno harbour**.
    - Less than a **2-minute walk** — message us your arrival boat and we'll meet you or send pin directions.
    - Luggage? A **cidomo** (horse cart) can drop you at the gate for a small fee if you prefer not to walk.
  tip: "Tip: morning boats are calmer. If seas look rough, ask your operator—schedules shift with weather."
  cta_label: Tell us your arrival plans
  map_caption: Approximate pin near Gili Meno harbour — we'll refine walking directions when you book.

