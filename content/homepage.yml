island:
  heading: The untouched Gili Island
  intro: Gili Meno is the smallest of the three Gili Islands off northwest Lombok. Stay at Rising Sun Bungalows, less than two minutes from Gili Meno harbour and partner with Meno Dive Club, when you want reefs and turtles without Gili Trawangan’s 18–25 pub crawls.
  features:
    - icon: turtle
      title: Turtles & shallow reefs
      body: Turtle City and east-coast snorkelling deliver daily encounters with green and hawksbill turtles over gardens of hard coral.
    - icon: wall
      title: Wall dives nearby
      body: Meno Wall, Secret Reef, Bounty Wreck, and classic Gili sites sit minutes away by boat—turtles, macro, and seasonal surprises.
    - icon: traffic
      title: No traffic stress
      body: Pedal the island loop in under two hours, hop a cidomo cart, or simply walk the shoreline—no scooters, no gridlock.
  cards:
    - image: /assets/web/beach-boat.jpg
      alt: Jukung boat and beach on Gili Meno
      title: Beach walks & boats
      body: White sand, jukungs on the tide line, and golden-hour light—minutes from the bungalows.
    - image: /assets/web/bikes-gazebo.jpg
      alt: Bicycles and thatched gazebo on Gili Meno
      title: Bikes & shade
      body: "Borrow island pace: pedal the loop, then rest under a thatched bale between snorkels."
    - image: /assets/web/dive-turtle-close.jpg
      alt: Sea turtle resting on the reef, Gili Meno
      title: Snorkel with turtles
      body: Shallow sites along Meno's coast suit beginners—early mornings mean glassy water and fewer day-trip crowds.
  cta_label: How to get here

