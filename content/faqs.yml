items:
  - question: How much is Rising Sun Bungalows per night?
    answer: From 500.000 IDR per night. Monthly and long-stay rates are available on request via the booking form.
  - question: How many bungalows are there?
    answer: Five traditional Sasak-style lumbung bungalows, each with AC, mosquito net, ensuite bathroom, and a private veranda.
  - question: How do I get to Rising Sun Bungalows on Gili Meno?
    answer: From Bali take a fast boat (~1.5–2 hours) to the Gilis. From Lombok take a boat from Bangsal (~20–40 minutes). From Gili Trawangan or Gili Air take a short inter-island boat. The bungalows are about 2 minutes’ walk from Gili Meno harbour. There are no cars or motorbikes on the Gilis.
  - question: Is there diving at Rising Sun Bungalows?
    answer: Stay with Rising Sun Bungalows and dive with partner Meno Dive Club — an SSI centre on Gili Meno offering fun dives, beginner experiences, full courses, and Dive & Stay packages.
  - question: Do you offer monthly rates or remote-work stays?
    answer: Yes. Longer stays with Wi-Fi and workspace are a growing part of the business. Ask for the current monthly rate on the booking form and select Monthly / long stay.
  - question: Why stay on Gili Meno instead of Gili Trawangan?
    answer: Gili Meno is the untouched Gili — first choice if you want turtles, reefs, and island pace without Trawangan’s 18–25 pub-crawl scene or a dense wellness / life-coach circuit.
